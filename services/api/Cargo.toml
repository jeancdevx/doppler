[package]
name = "doppler-api"
version = "1.0.0"
edition = "2021"
description = "API principal en Rust (Axum + Tokio + SQLite + Cloudflare R2) para Doppler"

[dependencies]
axum = { version = "0.8.4", features = ["macros"] }
axum-extra = { version = "0.10.1", features = ["cookie"] }
tokio = { version = "1.44.2", features = ["full"] }
tower = { version = "0.5.2", features = ["limit", "timeout"] }
tower-http = { version = "0.6.2", features = ["cors", "trace", "limit", "set-header"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sqlx = { version = "0.8.5", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
aws-config = "1.6.1"
aws-credential-types = "1.2.2"
aws-sdk-s3 = "1.82.0"
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2.0.12"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
chrono = { version = "0.4.40", features = ["serde"] }
uuid = { version = "1.16.0", features = ["v4"] }
hmac = "0.12.1"
sha2 = "0.10.8"
hex = "0.4.3"
rand = "0.9.1"
subtle = "2.6.1"
dotenvy = "0.15.7"
bytes = "1.10.1"
http = "1.3.1"
time = "0.3.41"

[dev-dependencies]
tempfile = "3.19.1"
tower = { version = "0.5.2", features = ["util"] }
