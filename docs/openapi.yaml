openapi: 3.1.0
info:
  title: Doppler HTTP API
  version: 1.0.0
  description: >-
    Contrato HTTP de Doppler para carga directa de archivos WAV en Cloudflare R2
    privado, encolado persistente en SQLite, inferencia acústica ResNet18 Log-Mel
    por ventanas de 3,0 s, reproducción temporal autorizada y exportación trazable.
servers:
  - url: http://localhost:4321
    description: Origen local servido por Caddy (proxy /api -> Rust Axum)
  - url: http://127.0.0.1:18080
    description: Puerto interno de depuración local de la API Rust (solo loopback)

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: doppler_session
      description: >-
        Cookie HttpOnly, SameSite=Lax firmada con HMAC-SHA256 que vincula los
        trabajos a una sesión anónima sin cuentas de usuario.
    AdminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: >-
        Token administrativo local validado en tiempo constante contra ADMIN_API_TOKEN
        del servidor. Reside únicamente en memoria en la consola /mantenimiento.

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - config_error
                - validation_error
                - limit_exceeded
                - queue_full
                - rate_limited
                - unauthorized
                - not_found
                - invalid_state_transition
                - r2_error
                - inference_error
                - database_error
                - maintenance_mode
                - internal_error
            message:
              type: string

    LimitsInfo:
      type: object
      required:
        - allowed_extensions
        - max_file_bytes
        - max_duration_seconds
        - min_window_seconds
        - window_seconds
        - hop_seconds
        - retention_hours
        - max_queue_depth
        - max_concurrent_inference
      properties:
        allowed_extensions:
          type: array
          items:
            type: string
        max_file_bytes:
          type: integer
        max_duration_seconds:
          type: integer
        min_window_seconds:
          type: number
        window_seconds:
          type: number
        hop_seconds:
          type: number
        retention_hours:
          type: integer
        max_queue_depth:
          type: integer
        max_concurrent_inference:
          type: integer

    SessionResponse:
      type: object
      required: [session_id, limits]
      properties:
        session_id:
          type: string
        limits:
          $ref: '#/components/schemas/LimitsInfo'

    CreateUploadRequest:
      type: object
      required: [filename, size_bytes]
      properties:
        filename:
          type: string
          example: sirena_muestra.wav
        size_bytes:
          type: integer
          minimum: 1
          maximum: 26214400
        content_type:
          type: string
          default: audio/wav

    CreateUploadResponse:
      type: object
      required: [job_id, run_id, status, upload, expires_at, retention_hours]
      properties:
        job_id:
          type: string
        run_id:
          type: string
        status:
          type: string
          enum: [uploading]
        upload:
          type: object
          required: [method, url, headers, expires_in_seconds]
          properties:
            method:
              type: string
              enum: [PUT]
            url:
              type: string
              format: uri
            headers:
              type: object
              additionalProperties:
                type: string
            expires_in_seconds:
              type: integer
        expires_at:
          type: string
          format: date-time
        retention_hours:
          type: integer

    ConfirmUploadRequest:
      type: object
      properties:
        client_upload_ms:
          type: number
          nullable: true

    WindowPrediction:
      type: object
      required: [index, start_seconds, end_seconds, score, label, margin_vs_threshold]
      properties:
        index:
          type: integer
        start_seconds:
          type: number
        end_seconds:
          type: number
        score:
          type: number
          description: Salida sigmoide sin calibrar en [0, 1]
        label:
          type: string
          enum: [EMERGENCY, NON_EMERGENCY]
        margin_vs_threshold:
          type: number

    MergedInterval:
      type: object
      required: [start_seconds, end_seconds, duration_seconds, window_count, max_score]
      properties:
        start_seconds:
          type: number
        end_seconds:
          type: number
        duration_seconds:
          type: number
        window_count:
          type: integer
        max_score:
          type: number

    JobDetail:
      type: object
      required:
        - job_id
        - run_id
        - filename
        - status
        - declared_size_bytes
        - windows_total
        - windows_positive
        - positive_coverage_seconds
        - positive_coverage_note
        - merged_positive_intervals
        - windows
        - short_clip
        - timings
        - created_at
        - expires_at
      properties:
        job_id:
          type: string
        run_id:
          type: string
        filename:
          type: string
        status:
          type: string
          enum: [uploading, queued, analyzing, completed, failed]
        queue_position:
          type: integer
          nullable: true
        declared_size_bytes:
          type: integer
        actual_size_bytes:
          type: integer
          nullable: true
        error_code:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        audio_sha256:
          type: string
          nullable: true
        model_sha256:
          type: string
          nullable: true
        contract_version:
          type: string
          nullable: true
        contract_sha256:
          type: string
          nullable: true
        threshold:
          type: number
          nullable: true
        score_type:
          type: string
          nullable: true
        windows_total:
          type: integer
        windows_positive:
          type: integer
        positive_coverage_seconds:
          type: number
        positive_coverage_note:
          type: string
        merged_positive_intervals:
          type: array
          items:
            $ref: '#/components/schemas/MergedInterval'
        windows:
          type: array
          items:
            $ref: '#/components/schemas/WindowPrediction'
        short_clip:
          type: boolean
        short_clip_message:
          type: string
          nullable: true
        timings:
          type: object
          properties:
            client_upload_ms:
              type: number
              nullable: true
            queue_wait_ms:
              type: number
              nullable: true
            r2_fetch_ms:
              type: number
              nullable: true
            decode_and_prepare_ms:
              type: number
              nullable: true
            inference_ms:
              type: number
              nullable: true
            persist_ms:
              type: number
              nullable: true
            total_processing_ms:
              type: number
              nullable: true
        created_at:
          type: string
          format: date-time
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time

    AudioUrlResponse:
      type: object
      required: [job_id, url, expires_in_seconds, content_type]
      properties:
        job_id:
          type: string
        url:
          type: string
          format: uri
        expires_in_seconds:
          type: integer
        content_type:
          type: string

paths:
  /api/health:
    get:
      summary: Salud de la API, SQLite, R2 y disponibilidad del modelo
      responses:
        '200':
          description: Estado operativo agregado

  /api/session:
    get:
      summary: Consulta o crea una sesión anónima firmada y devuelve límites activos
      responses:
        '200':
          description: Sesión activa y configuración de límites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
    post:
      summary: Inicializa o renueva la sesión anónima firmada
      responses:
        '200':
          description: Sesión activa y configuración de límites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'

  /api/uploads:
    post:
      summary: Crea un trabajo pendiente y genera una URL PUT prefirmada en R2
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
      responses:
        '201':
          description: Trabajo creado con destino PUT firmado de corta duración
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUploadResponse'
        '400':
          description: Archivo o parámetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Tamaño declarado excede 25 MiB
        '429':
          description: Cola llena o cuota temporal excedida

  /api/jobs:
    get:
      summary: Lista los trabajos recientes de la sesión actual
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Lista de resúmenes de trabajos

  /api/jobs/{job_id}:
    get:
      summary: Consulta el estado, resultados por ventana, hashes y tiempos de un trabajo
      security:
        - SessionCookie: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detalle completo del trabajo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetail'
        '401':
          description: Sesión ausente o inválida
        '404':
          description: Trabajo no encontrado o perteneciente a otra sesión
    delete:
      summary: Elimina el objeto WAV en Cloudflare R2 y los resultados en SQLite
      security:
        - SessionCookie: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Eliminado correctamente
        '401':
          description: Sesión ausente o inválida
        '404':
          description: Trabajo no encontrado en la sesión

  /api/jobs/{job_id}/confirm:
    post:
      summary: Confirma idempotentemente la carga en R2 (HeadObject + tamaño real) y encola análisis
      security:
        - SessionCookie: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmUploadRequest'
      responses:
        '200':
          description: Trabajo encolado o estado actual si ya fue confirmado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetail'
        '400':
          description: El objeto aún no existe en R2 o está vacío
        '413':
          description: El tamaño real en R2 supera 25 MiB (objeto eliminado)
        '429':
          description: Cola llena

  /api/jobs/{job_id}/audio-url:
    get:
      summary: Genera una URL GET prefirmada temporal para reproducir el WAV privado
      security:
        - SessionCookie: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: URL temporal autorizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioUrlResponse'
        '401':
          description: Sesión inválida
        '404':
          description: Trabajo no encontrado en la sesión

  /api/jobs/{job_id}/export:
    get:
      summary: Exporta los resultados trazables de un trabajo completado en JSON o CSV
      security:
        - SessionCookie: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        '200':
          description: Archivo JSON o CSV descargable
        '409':
          description: El trabajo todavía no está completado

  /api/ready:
    get:
      summary: Readiness estricto de dependencias (SQLite, inferencia CPU, R2 y modo mantenimiento)
      responses:
        '200':
          description: Servicio listo para recibir tráfico
        '503':
          description: Alguna dependencia crítica no está disponible o el modo mantenimiento está activo

  /api/jobs/{job_id}/feedback:
    get:
      summary: Lista los reportes de retroalimentación creados en la sesión actual para un trabajo
      security:
        - SessionCookie: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de reportes del propietario de sesión
        '404':
          description: Trabajo no encontrado en la sesión
    post:
      summary: Registra un reporte de retroalimentación ligado al trabajo y ventana opcional/obligatoria
      security:
        - SessionCookie: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Reporte creado en estado received
        '400':
          description: Tipo de reporte, ventana o comentario inválidos
        '404':
          description: Trabajo no encontrado en la sesión
        '429':
          description: Cuota horaria de retroalimentación excedida

  /api/admin/overview:
    get:
      summary: Resumen operativo de monitoreo (sondas, incidentes, latencias 30 d, almacenamiento y despliegues)
      security:
        - AdminToken: []
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: Panel operativo agregado
        '401':
          description: Token administrativo ausente o inválido

  /api/admin/health/probe:
    post:
      summary: Ejecuta y persiste inmediatamente una sonda real de dependencias y evaluación de incidentes
      security:
        - AdminToken: []
      responses:
        '200':
          description: Resultado detallado de la sonda

  /api/admin/maintenance:
    get:
      summary: Consulta el estado de modo mantenimiento y trabajos activos en inferencia/cola
      security:
        - AdminToken: []
      responses:
        '200':
          description: Estado de mantenimiento y cola
    post:
      summary: Activa o desactiva el modo mantenimiento (rechaza nuevas cargas con HTTP 503 y pausa nuevos reclamos)
      security:
        - AdminToken: []
      responses:
        '200':
          description: Estado actualizado

  /api/admin/drift:
    get:
      summary: Consulta la referencia congelada activa, estado de representatividad y evaluaciones recientes de drift
      security:
        - AdminToken: []
      responses:
        '200':
          description: Estado de drift entrada/salida

  /api/admin/drift/reference:
    post:
      summary: Importa una referencia congelada de drift (con metadatos de procedencia y compatibilidad)
      security:
        - AdminToken: []
      responses:
        '201':
          description: Referencia importada y activada

  /api/admin/drift/evaluate:
    post:
      summary: Ejecuta una evaluación de drift de entrada y salida sobre observaciones de archivo
      security:
        - AdminToken: []
      responses:
        '200':
          description: Resultado explícito (no_alert, drift_detected, insufficient_data, no_reference, evaluation_error)

  /api/admin/feedback:
    get:
      summary: Lista la bandeja administrativa de retroalimentación y métricas deduplicadas de muestra revisada
      security:
        - AdminToken: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Reportes y métricas sobre muestra revisada (unavailable si n=0)

  /api/admin/feedback/{report_id}:
    patch:
      summary: Aplica una transición válida de la máquina de estados de revisión humana
      security:
        - AdminToken: []
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reporte actualizado
        '409':
          description: Transición de estado inválida

  /api/admin/deployments:
    post:
      summary: Registra en auditoría una validación, activación, rechazo o rollback de paquete de modelo
      security:
        - AdminToken: []
      responses:
        '201':
          description: Evento registrado en model_deployments
